name: Build APK

on:
  push:
    branches: [main, "**-LOS"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessaire pour publier une Release sur les tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique + tags complets pour le versionnement (git describe)

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android (cmdline-tools, sans le paquet obsolete "tools")
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Composants SDK + clang/lld
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-28" "build-tools;34.0.0"
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Version (git)
        id: ver
        run: echo "name=$(git describe --tags --always --dirty --exclude 'latest-*')" >> "$GITHUB_OUTPUT"

      - name: Build (build.sh)
        env:
          # Cle commune des applis LibreHU : une mise a jour s'installe par-dessus la precedente (LibreHU OTA).
          KEYSTORE: keystore/librehu.jks
          KS_PASS: librehu
          KS_ALIAS: librehu
        run: ./build.sh

      - name: Renomme l'APK avec la version
        run: cp out/JacMCU.apk "out/MCU-Toolkit-${{ steps.ver.outputs.name }}.apk"

      - name: Artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Toolkit-${{ steps.ver.outputs.name }}
          path: out/MCU-Toolkit-${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error

      - name: Release GitHub (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MCU-Toolkit-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true

      - name: Release continue de la branche (LibreHU OTA)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Une pre-release par branche (tag latest-<branche>), APK MCU-Toolkit-<branche>.apk ; les notes portent la
          # version lue par LibreHU OTA (versionCode = nombre de commits, comme build.sh).
          SLUG="${BRANCH//\//-}"
          TAG="latest-$SLUG"
          OUT="MCU-Toolkit-$SLUG.apk"
          cp out/JacMCU.apk "$OUT"
          CODE=$(git rev-list --count HEAD)
          NAME=$(git describe --tags --always --exclude 'latest-*')
          printf 'versionCode=%s\nversionName=%s\nbranch=%s\ncommit=%s\n\n%s\n' \
            "$CODE" "$NAME" "$BRANCH" "$GITHUB_SHA" "$(git log -1 --pretty=%s)" > notes.txt
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MCU Toolkit $NAME ($BRANCH)" --notes-file notes.txt --prerelease
          else
            gh release create "$TAG" --title "MCU Toolkit $NAME ($BRANCH)" --notes-file notes.txt --prerelease --verify-tag
          fi
          gh release upload "$TAG" "$OUT" --clobber
