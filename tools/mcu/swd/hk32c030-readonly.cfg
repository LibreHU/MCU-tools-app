# OpenOCD (>= 0.12) - lecture seule du MCU HK32C030 de l'autoradio par les GPIO d'un Raspberry Pi 2/3.
# Cablage (MCU LQFP48 -> en-tete du Pi) :
#   SWCLK broche 37 -> GPIO11 (pin 23)   SWDIO broche 34 -> GPIO25 (pin 22)   GND -> pin 20     NRST : non branche
# Verifier d'abord au multimetre que le VDD du MCU (broches 1/24/48) est a 3,3 V : les GPIO du Pi ne tolerent pas 5 V.
# Ne jamais faire "halt" ni "reset" : le MCU pilote l'alimentation du SoC et le chien de garde peut etre materiel.
#   sudo openocd -f hk32c030-readonly.cfg -c "init; mdw 0x4002201C; mdw 0x1FFFF800 16; shutdown"
#   (seulement si RDPRT = 0)
#   sudo openocd -f hk32c030-readonly.cfg -c "init; dump_image hk_flash.bin 0x08000000 0x10000; \
#        dump_image hk_sysmem.bin 0x1FFFEC00 0xC00; dump_image hk_opt.bin 0x1FFFF800 0x40; shutdown"
adapter driver bcm2835gpio
bcm2835gpio peripheral_base 0x3F000000
bcm2835gpio speed_coeffs 225000 36
adapter gpio swclk -chip 0 11
adapter gpio swdio -chip 0 25
transport select swd
adapter speed 100
reset_config none
swd newdap hk cpu -enable
dap create hk.dap -chain-position hk.cpu
target create hk.cpu cortex_m -dap hk.dap
